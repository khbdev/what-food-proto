syntax = "proto3";

package notification;

option go_package = "notification-service/proto;notificationpb";

service NotificationService {
  rpc CreateNotification(CreateNotificationRequest) returns (NotificationResponse);
  rpc GetNotification(GetNotificationRequest) returns (NotificationResponse);
  rpc GetNotifications(GetNotificationsRequest) returns (GetNotificationsResponse);
  rpc UpdateNotification(UpdateNotificationRequest) returns (NotificationResponse);
  rpc DeleteNotification(DeleteNotificationRequest) returns (DeleteNotificationResponse);
}

/* CORE MODEL */
message Notification {
  uint64 id = 1;
  string title = 2;
  string description = 3;
  string image_url = 4;
  int64 created_at = 5;
  int64 updated_at = 6;
}

/* WRAPPER RESPONSE */
message NotificationResponse {
  Notification notification = 1;
}

/* CREATE (ID YO‘Q!) */
message CreateNotificationRequest {
  string title = 1;
  string description = 2;
  string image_url = 3;
}

/* READ BY ID */
message GetNotificationRequest {
  uint64 id = 1;
}

/* LIST */
message GetNotificationsRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message GetNotificationsResponse {
  repeated Notification notifications = 1;
}

/* UPDATE */
message UpdateNotificationRequest {
  uint64 id = 1;
  string title = 2;
  string description = 3;
  string image_url = 4;
}

/* DELETE */
message DeleteNotificationRequest {
  uint64 id = 1;
}

message DeleteNotificationResponse {
  bool success = 1;
}